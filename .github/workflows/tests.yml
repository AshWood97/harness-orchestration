name: Test skills

on:
  push:
    paths:
      - '.agents/skills/codex-zcode/**'
      - 'zcode/**'
      - 'scripts/build_zcode_runtime.mjs'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '.agents/skills/codex-zcode/**'
      - 'zcode/**'
      - 'scripts/build_zcode_runtime.mjs'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run Codex ZCode and ZCode tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s .agents/skills/codex-zcode/tests -p 'test_*.py' -q
          python -B -m unittest discover -s zcode/tests -p 'test_*.py' -q
          node --test .agents/skills/codex-zcode/tests/*.test.mjs
      - name: Run Native installer tests only on explicit manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s .agents/skills/codex-native-orchestrator/tests -p 'test_*.py' -q
